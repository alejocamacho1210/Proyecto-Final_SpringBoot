spring.application.name=coworkhub
spring.datasource.url=jdbc:mysql://localhost:3307/coworkhub?serverTimezone=UTC
spring.datasource.username=coworkhub
spring.datasource.password=coworkhub
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver
spring.jpa.hibernate.ddl-auto=create
spring.jpa.open-in-view=false
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.defer-datasource-initialization=true
spring.sql.init.mode=never
management.endpoints.web.exposure.include=health
management.endpoint.health.show-details=never
management.endpoint.health.show-components=never
management.endpoint.health.probes.enabled=false
server.error.include-message=never
coworkhub.jwt.secret=${COWORKHUB_JWT_SECRET:CoWorkHub-development-secret-key-change-before-production-2026}
coworkhub.jwt.expiration-minutes=60
coworkhub.bootstrap.admin-username=${COWORKHUB_ADMIN_USERNAME:admin}
springdoc.swagger-ui.path=/doc/swagger-ui.html
springdoc.api-docs.path=/v3/api-docs
springdoc.show-actuator=true
